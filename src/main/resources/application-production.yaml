# Class 17: production profile. Activate with SPRING_PROFILES_ACTIVE=production.
# Deployment values (issuer, key set, audience, resource) come from the environment; the
# actuator surface is scoped to health/info/prometheus and health details are
# hidden so nothing leaks to whoever can reach the actuator path.
spring:
  ai:
    mcp:
      server:
        type: SYNC
        protocol: STREAMABLE
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${MCP_JWT_ISSUER}
          audiences:
            - ${MCP_JWT_AUDIENCE}
          # Replaces the base profile's local Keycloak address. Without it the key
          # set is still fetched from localhost:8180, and every request with a token
          # fails.
          jwk-set-uri: ${MCP_JWT_JWK_SET_URI}
moviedb:
  mcp:
    # The resource URI that the metadata document advertises. The base profile's
    # value is the local endpoint, so production must set its public address.
    resource: ${MCP_RESOURCE}

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: never
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://otel-collector:4318/v1/traces
          headers: {}
