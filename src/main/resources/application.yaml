server:
  port: 8080

spring:
  application:
    name: moviedb
  datasource:
    url: jdbc:h2:mem:moviedb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  graphql:
    graphiql:
      enabled: true
    websocket:
      path: /graphql
    cors:
      allowed-origins: http://localhost:5173
      allow-credentials: true
  threads:
    virtual:
      enabled: true
  ai:
    mcp:
      server:
        name: moviedb-mcp
        version: 1.0.0
        type: SYNC
        protocol: STREAMABLE
        capabilities:
          tool: true
          resource: false
          prompt: false
          completion: false
        # Class 8: tools are registered through the schemaDescribedTools bean
        # (SyncToolSpecification list); the scanner would register duplicates.
        annotation-scanner:
          enabled: false
  # Class 15: the /mcp chain validates JWTs minted by an external OAuth 2.1
  # authorization server. The example points at a Keycloak realm; swap in your
  # platform's issuer. jwk-set-uri keeps the decoder lazy (no fetch at startup),
  # issuer-uri and audiences add iss/aud validation.
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://auth.example.com/realms/moviedb
          audiences:
            - moviedb-mcp
          jwk-set-uri: https://auth.example.com/realms/moviedb/protocol/openid-connect/certs
jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  expiration: 86400000
demo:
  # Artificial resolver latency for demoing batching / parallel field fetching. 0 = no delay.
  latency: 0s
tmdb:
  # API Read Access Token (v4); empty fallback keeps the app fully usable without a key
  api-key: ${TMDB_API_KEY:}
  base-url: https://api.themoviedb.org/3
  image-base-url: https://image.tmdb.org/t/p/w500
moviedb:
  mcp:
    # Class 15: the canonical resource URI (RFC 8707). Clients send
    # resource=<this> when requesting a token; the audiences entry above is the
    # server half that rejects tokens minted for anything else.
    resource: https://api.example.com/mcp
graphql:
  # Instrumentation configuration
  # 15, not 10: the standard introspection query is depth 13, so anything lower
  # breaks GraphiQL docs/autocomplete and codegen tooling.
  max-query-depth: 15
  slow-resolver-threshold-ms: 100
# Class 17: production observability. The Prometheus registry exposes per-tool
# meters (ToolMetricsAspect) on /actuator/prometheus; percentile histograms turn
# mcp.tool.duration into latency buckets. Tracing samples every request in dev
# (sampling 1.0); the OTLP endpoint is set per-environment in
# application-production.yaml so the default profile ships no collector address.
management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  metrics:
    distribution:
      percentiles-histogram:
        mcp.tool.duration: true
  tracing:
    sampling:
      probability: 1.0