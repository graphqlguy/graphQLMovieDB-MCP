spring:
  main:
    # CLI agent, no embedded web server.
    web-application-type: none
  ai:
    model:
      # The pom has two chat model starters. This property picks the one to use;
      # without it Spring AI creates both and the ChatClient cannot choose.
      chat: anthropic
    anthropic:
      api-key: ${ANTHROPIC_API_KEY}
      chat:
        # Pin the model explicitly; starter defaults can point at retired models.
        model: claude-sonnet-5
    mcp:
      client:
        enabled: true
        name: moviedb-agent
        version: 1.0.0
        type: SYNC
        request-timeout: 30s
        streamable-http:
          connections:
            moviedb:
              url: http://localhost:8080
              endpoint: /mcp
