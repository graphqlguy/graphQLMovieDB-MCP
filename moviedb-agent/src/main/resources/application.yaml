spring:
  main:
    # CLI agent, no embedded web server.
    web-application-type: none
  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY}
      chat:
        options:
          # Pin the model explicitly; starter defaults can point at retired models.
          model: claude-sonnet-5
    mcp:
      client:
        enabled: true
        name: moviedb-agent
        version: 1.0.0
        type: SYNC
        request-timeout: 30s
        streamable-http:
          connections:
            moviedb:
              url: http://localhost:8080
              endpoint: /mcp
