# Summarize user reviews for a specific movie.
# Use this only after the user has identified a movie they care about; do not
# call it speculatively across many movies. Always returns a summary object;
# when there are fewer than three reviews the summary field is null instead,
# and the user should be told "not enough reviews yet," not that the movie
# has no reviews. reviewCount says exactly how many reviews were found.
query SummarizeMovieReviews($movieId: ID!) {
  summarizeMovieReviews(movieId: $movieId) {
    movieId
    reviewCount
    summary
    themes
    averageScore
  }
}
