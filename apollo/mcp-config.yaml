endpoint: http://localhost:8080/graphql

transport:
  type: streamable_http
  address: 127.0.0.1
  port: 8000

schema:
  source: local
  path: ./schema.graphqls

operations:
  source: local
  paths:
    - ./operations

custom_scalars: ./custom-scalars.json

# Local-development shortcut (Class 5): pass the caller's bearer token straight
# through to Spring so its JWT filter and @PreAuthorize rules keep working.
# Anywhere beyond your laptop, prefer the transport.auth resource-server block
# (see mcp-config.yaml comments in the chapter and the Apollo auth docs).
forward_headers:
  - authorization

overrides:
  mutation_mode: explicit
  enable_output_schema: true
