endpoint: http://localhost:8080/graphql

transport:
  type: streamable_http
  address: 127.0.0.1
  port: 8000

schema:
  source: local
  path: ./schema.graphqls

operations:
  source: local
  paths:
    - ./operations

custom_scalars: ./custom-scalars.json

# Local-development shortcut (Class 5): pass the caller's bearer token straight
# through to Spring so its JWT filter and @PreAuthorize rules keep working.
# Outside local development, use the transport.auth resource-server block
# instead, which Class 5 shows and the Apollo MCP Server auth docs describe.
forward_headers:
  - authorization

overrides:
  mutation_mode: explicit
  enable_output_schema: true
